version: "3.9"

services:

  app:
    build: ./app
    container_name: fastapi-app

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    restart: always

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    restart: always

  redis:
    image: redis:7

    restart: always
